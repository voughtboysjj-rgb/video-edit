[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "shorts-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Pillow==12.3.0"]
[project.scripts]
shorts = "shorts_automation.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

name: Test and optionally render originals
on:
  push:
    paths: ['src/**', 'tests/**', 'requirements.lock', '.github/workflows/tests.yml']
  workflow_dispatch:
    inputs:
      render:
        type: boolean
        default: false
        description: Render the two fixed original motion studies (not a daily content engine)
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements.lock
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.render }}
        run: |
          PYTHONPATH=src python -m shorts_automation.cli produce --variant 1
          PYTHONPATH=src python -m shorts_automation.cli produce --variant 2
      - if: ${{ github.event_name == 'workflow_dispatch' && inputs.render }}
        uses: actions/upload-artifact@v4
        with:
          name: original-motion-studies
          path: |
            outputs/*.mp4
            outputs/*.json
          retention-days: 7
